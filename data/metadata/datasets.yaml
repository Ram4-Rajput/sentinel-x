      DOWNLOADED 2026-09-04 from the Kaggle mirror 'mrwellsdavid/unsw-nb15'
      (CSV flow files; the official SharePoint source is browser-only and had
      failed previously). License: free for academic research (cite the 5
      Moustafa/Slay papers listed on the official UNSW-NB15 page).
