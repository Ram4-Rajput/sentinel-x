# Sentinel-X Dataset Audit — Phase 1
# Generated by the sentinel-x-dataset-research skill.
# STATUS: audit only. No raw files were moved, renamed, merged, or modified.
#
# IMPORTANT PROVENANCE NOTE:
#   The four datasets requested (CIC-IDS2018, UNSW-NB15, CTU-13, CICIoT2023) were
#   expected under a project data/raw/ directory. No such directory exists in the
#   workspace (D:\sentinel\sentinel contains only .kiro). The raw data was located
#   in a SIBLING directory: D:\sentinel\data  and  D:\DATA.
#   Filenames on disk are misleading and were verified by schema/label inspection,
#   NOT by trusting names (per skill rule: "Do not assume filenames").

audit:
  inspected_on: 2026-09-04
  data_roots_found:
    - "D:\\sentinel\\data"
    - "D:\\DATA"
  project_data_raw_dir_present: false
  note: >
    A folder named "CSE-CIC-IDS2018" actually contains THREE different things:
    (1) genuine CIC-IDS2018 CICFlowMeter per-day CSVs under processed/,
    (2) a CICIoT2023 dataset mislabeled as root-level train/test/validation.csv,
    (3) a CTU-13 tarball. UNSW-NB15 is present only as a FAILED/EMPTY download.

datasets:

  - dataset: CIC-IDS2018
    aka: [CSE-CIC-IDS2018, IDS2018]
    version: "CSE-CIC-IDS2018 (2018), CICFlowMeter-v3 flow export"
    source: >
      Canadian Institute for Cybersecurity (CIC) / Communications Security
      Establishment (CSE). Generated Feb-Mar 2018. Identity confirmed by the
      80-column CICFlowMeter schema, day-stamped filenames, and Benign/attack
      labels dated 14/02/2018 - 01/03/2018.
    identity_confidence: high  # confirmed by schema + timestamps + labels
    location: "D:\\DATA\\CSE-CIC-IDS2018\\processed\\"
    files:
      - Wednesday-14-02-2018_TrafficForML_CICFlowMeter.csv   # ~358 MB
      - Thursday-15-02-2018_TrafficForML_CICFlowMeter.csv    # ~376 MB
      - Friday-16-02-2018_TrafficForML_CICFlowMeter.csv      # ~334 MB
      - Thuesday-20-02-2018_TrafficForML_CICFlowMeter.csv    # ~4054 MB (sic: "Thuesday")
      - Wednesday-21-02-2018_TrafficForML_CICFlowMeter.csv   # ~329 MB
      - Thursday-22-02-2018_TrafficForML_CICFlowMeter.csv    # ~383 MB
      - Friday-23-02-2018_TrafficForML_CICFlowMeter.csv      # ~383 MB
      - Wednesday-28-02-2018_TrafficForML_CICFlowMeter.csv   # ~209 MB
      - Thursday-01-03-2018_TrafficForML_CICFlowMeter.csv    # ~108 MB (331,126 rows incl header)
      - Friday-02-03-2018_TrafficForML_CICFlowMeter.csv      # ~352 MB
    size: "~6.57 GB across 10 CSV files (uncompressed, on disk)"
    file_types: {csv: 10, pcap: 0}
    schema_columns: 80
    features:
      flow_level: true
      packet_level: false   # per-flow aggregates only; no raw packets
      columns_sample: [Dst Port, Protocol, Timestamp, Flow Duration, Tot Fwd Pkts,
        Tot Bwd Pkts, TotLen Fwd Pkts, TotLen Bwd Pkts, Fwd Pkt Len Max/Min/Mean/Std,
        Bwd Pkt Len Max/Min/Mean/Std, Flow Byts/s, Flow Pkts/s,
        Flow IAT Mean/Std/Max/Min, Fwd IAT Tot/Mean/Std/Max/Min,
        Bwd IAT Tot/Mean/Std/Max/Min, Fwd PSH Flags, Bwd PSH Flags,
        Fwd URG Flags, Bwd URG Flags, Fwd Header Len, Bwd Header Len,
        Pkt Len Min/Max/Mean/Std/Var, FIN/SYN/RST/PSH/ACK/URG/CWE/ECE Flag Cnt,
        Down/Up Ratio, Pkt Size Avg, Init Fwd/Bwd Win Byts, Fwd Act Data Pkts,
        Active Mean/Std/Max/Min, Idle Mean/Std/Max/Min, Label]
    tcp_flags: "flag COUNTS present (FIN/SYN/RST/PSH/ACK/URG/CWE/ECE Flag Cnt, Fwd/Bwd PSH/URG Flags). No per-packet flag sequence."
    ttl_window_fragment_retransmission:
      ttl: false
      window: "Init Fwd Win Byts / Init Bwd Win Byts only (initial TCP window)"
      fragmentation: false
      retransmission: false
    iat_features: "rich: Flow IAT (Mean/Std/Max/Min), Fwd IAT, Bwd IAT, Active/Idle."
    labels: "Label column (last). Multi-class attack family names + 'Benign'."
    timestamp_fields: ["Timestamp (dd/MM/yyyy HH:mm:ss)"]
    source_dest_fields:
      dst_port: true
      src_ip: false        # NOTE: source/destination IPs are NOT in the ML CSVs
      dst_ip: false
      note: >
        CICFlowMeter ML CSVs drop Src/Dst IP. Only Dst Port + Protocol remain.
        Graph construction from these CSVs alone is NOT possible without the
        original labelled flow files (which include IPs) or the raw PCAPs.
    attack_categories:
      observed_in_samples:
        - FTP-BruteForce
        - SSH-Bruteforce
        - "DoS attacks-Hulk"
        - "DoS attacks-SlowHTTPTest"
      full_taxonomy_expected: [Benign, FTP-BruteForce, SSH-Bruteforce, "DoS-GoldenEye",
        "DoS-Slowloris", "DoS-Hulk", "DoS-SlowHTTPTest", "DDoS-LOIC-HTTP",
        "DDoS-LOIC-UDP", "DDoS-HOIC", "Brute Force -Web", "Brute Force -XSS",
        "SQL Injection", "Infiltration", "Bot"]
    benign_traffic: "present ('Benign'); proportion varies by day (e.g. Fri-16-02 ~20% benign in sample)."
    missing_values: "known CICFlowMeter issues: Flow Byts/s and Flow Pkts/s can be Infinity/NaN; verify per column before use."
    duplicates: "known duplicate-flow issue in CIC-IDS2018; must be checked with train-only dedup before modeling."
    class_imbalance: "severe and per-day (each day is dominated by one attack family; e.g. Wed-14-02 ~90% FTP-BruteForce)."
    temporal_coverage: "10 capture days, 14 Feb 2018 - 02 Mar 2018 (weekday captures)."
    scenario_boundaries: "one file per capture DAY = natural scenario/day boundary. Do NOT merge across days before schema+temporal analysis."
    graph_constructable: "NOT from processed ML CSVs (no IPs). Possible only if original IP-bearing flow files or PCAPs are obtained."
    temporal_graph_suitable: "partial: strong timestamps + IAT, but missing entity IDs blocks G_t node identity."
    leakage_risks:
      - "Per-day single-family dominance: shuffling across days leaks label via time."
      - "Flow Byts/s, Flow Pkts/s infinities correlate with specific attacks."
      - "Timestamp must not be used as a feature."
      - "Dedup and preprocessing must be fit on train split only."
    recommended_use: >
      Primary flow-level training/eval for classification and short-horizon
      forecasting of attack presence. Best temporal per-day structure of the
      available data. Not directly graph-ready.
    limitations: >
      No Src/Dst IP in ML CSVs (blocks native graph build); packet-level absent;
      known NaN/Inf and duplicate issues; one attack family dominates each day.
    required_files: "all 10 processed/ day CSVs (each day is a distinct scenario)."
    unused_files: "the root-level CSE-CIC-IDS2018.zip (3.93 GB) if processed/ is already the extracted authoritative copy — verify before relying."

  - dataset: CICIoT2023
    aka: [CIC-IoT-2023, CICIoT2023 (Neto et al. 2023)]
    version: "CICIoT2023 (2023) 47-feature flow schema"
    source: >
      Canadian Institute for Cybersecurity (CIC), IoT testbed 2023.
      Identity confirmed by the exact 47-column schema (flow_duration,
      Header_Length, Protocol Type, Rate, Srate, Drate, *_flag_number,
      *_count, HTTP..IRC protocol flags, Magnitue, Radius, Covariance,
      Variance, Weight) and Mirai / DDoS-* / DoS-* / Recon-* / MITM labels.
    identity_confidence: high  # confirmed by schema + label taxonomy
    location: "D:\\DATA\\CSE-CIC-IDS2018\\  (MISFILED under the IDS2018 folder)"
    files:
      - train.csv        # ~1548 MB
      - test.csv         # ~332 MB
      - validation.csv   # ~332 MB
    size: "~2.21 GB across 3 pre-split CSV files"
    file_types: {csv: 3, pcap: 0}
    schema_columns: 47
    features:
      flow_level: true
      packet_level: false  # engineered per-flow statistics; raw PCAPs NOT present here
      columns: [flow_duration, Header_Length, "Protocol Type", Duration, Rate,
        Srate, Drate, fin_flag_number, syn_flag_number, rst_flag_number,
        psh_flag_number, ack_flag_number, ece_flag_number, cwr_flag_number,
        ack_count, syn_count, fin_count, urg_count, rst_count, HTTP, HTTPS, DNS,
        Telnet, SMTP, SSH, IRC, TCP, UDP, DHCP, ARP, ICMP, IPv, LLC, "Tot sum",
        Min, Max, AVG, Std, "Tot size", IAT, Number, Magnitue, Radius,
        Covariance, Variance, Weight, label]
    tcp_flags: "per-flow flag indicators + counts: fin/syn/rst/psh/ack/ece/cwr_flag_number and *_count."
    ttl_window_fragment_retransmission:
      ttl: false
      window: false
      fragmentation: "implied only via label families (e.g. DDoS-ICMP_Fragmentation); no explicit fragment feature column"
      retransmission: false
    iat_features: "single aggregate 'IAT' column (not fwd/bwd split like CIC-IDS2018)."
    labels: "label column (last). Fine-grained multi-class (34-class taxonomy)."
    timestamp_fields: []   # NO timestamp column present
    source_dest_fields:
      src_ip: false
      dst_ip: false
      ports: "protocol-presence flags only (HTTP/HTTPS/DNS/... and TCP/UDP/ICMP); no explicit port number column"
      note: "No entity identifiers and no timestamp -> cannot build temporal graphs or ordered sequences from these files."
    attack_categories:
      observed_in_samples: [DDoS-ICMP_Flood, DDoS-UDP_Flood, DDoS-TCP_Flood,
        DDoS-PSHACK_Flood, DDoS-SYN_Flood, DDoS-RSTFINFlood, DDoS-SynonymousIP_Flood,
        DoS-UDP_Flood, DoS-TCP_Flood, DoS-SYN_Flood, BenignTraffic,
        Mirai-greeth_flood, Mirai-udpplain, Mirai-greip_flood,
        DDoS-ICMP_Fragmentation, MITM-ArpSpoofing, DDoS-UDP_Fragmentation,
        DDoS-ACK_Fragmentation, DNS_Spoofing, Recon-HostDiscovery, Recon-OSScan,
        Recon-PortScan, DoS-HTTP_Flood, VulnerabilityScan, DDoS-HTTP_Flood]
    benign_traffic: "present as 'BenignTraffic'; RARE (~2.3% in 200k train sample) -> strong imbalance."
    missing_values: "check per column; engineered stats can contain zeros for absent protocols (not missing)."
    duplicates: "high risk: flood attacks produce many near-identical flows; dedup on train split only."
    class_imbalance: "extreme: DDoS/DoS families dominate; benign and Recon/Web classes are tiny (<1%)."
    temporal_coverage: "UNKNOWN — no timestamp column; temporal ordering not recoverable from these CSVs."
    scenario_boundaries: "pre-split into train/test/validation (provenance of the split is unknown -> possible leakage; see risks)."
    graph_constructable: "NO (no entity IDs)."
    temporal_graph_suitable: "NO (no timestamps, no entities)."
    leakage_risks:
      - "CRITICAL: dataset arrived PRE-SPLIT (train/test/validation) with unknown methodology; splits may share correlated flows -> re-derive splits or verify independence before trusting."
      - "No timestamp -> cannot guarantee temporal separation; treat as IID-style classification only."
      - "Extreme imbalance makes accuracy meaningless (use PR-AUC / recall)."
    recommended_use: >
      Unseen-attack / OOD and novelty evaluation source (rich modern IoT attack
      taxonomy distinct from IDS2018), and secondary classification benchmark.
      NOT suitable as the temporal-trajectory dataset.
    limitations: "no timestamps, no entities, no packet data, unknown split provenance, extreme imbalance."
    required_files: "train.csv + test.csv + validation.csv (but re-verify split independence)."
    unused_files: "none extra."

