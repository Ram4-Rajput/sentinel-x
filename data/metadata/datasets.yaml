    duplicates: "check per file; raw files are header-less so assign column names from NUSW-NB15_features.csv before dedup."
    class_imbalance: "moderate-to-severe: Normal + Generic dominate; Worms/Shellcode/Backdoor/Analysis are tiny (<1%)."
    temporal_coverage: "Stime/Ltime present (epoch timestamps) -> orderable; two capture periods (Jan & Feb 2015)."
