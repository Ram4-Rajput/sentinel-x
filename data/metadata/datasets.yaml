    status: PRESENT_VERIFIED
    location: "D:\\DATA\\UNSW-NB15\\"
    files:
      - UNSW-NB15_1.csv            # ~169 MB, 700,000 records (no header row)
      - UNSW-NB15_2.csv            # ~165 MB, 700,000 records
      - UNSW-NB15_3.csv            # ~155 MB, 700,000 records
      - UNSW-NB15_4.csv            # ~98 MB, 440,044 records  (total raw = 2,540,044)
      - NUSW-NB15_features.csv     # 49-feature dictionary (No.,Name,Type,Description)
      - NUSW-NB15_GT.csv           # ~86 MB ground-truth table
      - UNSW-NB15_LIST_EVENTS.csv  # event list
      - UNSW_NB15_training-set.csv # labeled partition (~175,341 records; has header w/ attack_cat,Label)
      - UNSW_NB15_testing-set.csv  # labeled partition (~82,332 records; has header)
      - Payload_data_CICIDS2017.csv.zip  # bonus in Kaggle bundle; NOT part of UNSW-NB15, ignore for now
    size: "~1.4 GB extracted (149 MB zip). Raw flow files ~587 MB; GT ~86 MB; partitions ~46 MB."
    file_types: {csv: 9, zip_extra: 1, pcap: 0}
    schema_columns: 49  # raw files are header-less 49-col; partition CSVs add id + service and carry attack_cat,Label
    features:
      flow_level: true
      packet_level: false   # flow-level only via Kaggle; official PCAPs (~100 GB) NOT downloaded
      key_columns: [srcip, sport, dstip, dsport, proto, state, dur, sbytes, dbytes,
        sttl, dttl, sloss, dloss, service, Sload, Dload, Spkts, Dpkts, swin, dwin,
        stcpb, dtcpb, smeansz, dmeansz, trans_depth, res_bdy_len, Sjit, Djit,
