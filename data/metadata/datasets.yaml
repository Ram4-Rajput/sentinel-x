    tcp_flags: "no explicit flag-count columns; connection 'state' field (ACC/CLO/CON/FIN/INT/RST/...) encodes TCP state."
    ttl_window_fragment_retransmission:
      ttl: true              # sttl, dttl  (UNIQUE among the local datasets)
      window: true           # swin, dwin  (TCP window advertisement)
      fragmentation: false
      retransmission: true   # sloss, dloss (packets retransmitted/dropped)
    iat_features: "Sintpkt / Dintpkt (source/dest interpacket arrival), plus Sjit/Djit jitter and tcprtt/synack/ackdat setup times."
    labels: "attack_cat (multi-class, 9 categories) + Label (binary 0/1)."
    timestamp_fields: ["Stime (record start)", "Ltime (record last)"]
    source_dest_fields:
      src_ip: true    # srcip
      dst_ip: true    # dstip
      ports: true     # sport, dsport
      note: "FULL entity identifiers -> graph construction and temporal graphs ARE possible."
    attack_categories:
      taxonomy_9: [Normal, Generic, Exploits, Fuzzers, DoS, Reconnaissance, Analysis, Backdoor, Shellcode, Worms]
      observed_in_training_sample: {Normal: 37000, Generic: 18871, Exploits: 11132,
        Fuzzers: 6062, DoS: 4089, Reconnaissance: 3496, Analysis: 677, Backdoor: 583,
        Shellcode: 378, Worms: 44}
