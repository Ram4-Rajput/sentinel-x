# Sentinel-X Unified Schema — Feature Mapping
# Generated by the sentinel-x-dataset-research skill (Phase 1 audit).
#
# Purpose: map each LOCALLY PRESENT dataset's columns onto a single canonical
# Sentinel-X schema so the pipeline (telemetry -> flow/packet features ->
# temporal windows -> dynamic graph G_t -> Temporal GNN -> GRU/LSTM) can consume
# them WITHOUT merging the raw files. This is a mapping spec only; no data is
# transformed or merged here.
#
# Rules honored:
#   - No datasets merged. No preprocessing fit. Missing features are recorded as
#     ABSENT, never fabricated.
#   - "unavailable" means the source genuinely lacks it; do NOT synthesize.
#
# Datasets referenced (see datasets.yaml for provenance):
#   CIC-IDS2018  -> D:\DATA\CSE-CIC-IDS2018\processed\*.csv  (80-col CICFlowMeter)
#   CICIoT2023   -> D:\DATA\CSE-CIC-IDS2018\{train,test,validation}.csv (47-col)
#   CTU-13       -> D:\DATA\CSE-CIC-IDS2018\CTU-13-Dataset.tar.bz2 (.binetflow, not extracted)
#   UNSW-NB15    -> MISSING (broken download); mapping left as placeholders.

unified_schema:

  # ---------------- Entity / graph identity ----------------
  - unified_field: src_ip
    type: "string (ipv4/ipv6)"
    role: graph_node_source
    sources:
      - {dataset: CTU-13,      column: SrcAddr,  transform: direct}
      - {dataset: CIC-IDS2018, column: null,     transform: unavailable, note: "IP dropped from ML CSVs; only in original IP-flow files/PCAP"}
      - {dataset: CICIoT2023,  column: null,     transform: unavailable}
      - {dataset: UNSW-NB15,   column: srcip,    transform: "direct (once re-downloaded)"}
    notes: "Node identity for G_t. Only CTU-13 (and UNSW-NB15 when restored) can build graphs natively."

  - unified_field: dst_ip
    type: "string (ipv4/ipv6)"
    role: graph_node_dest
    sources:
      - {dataset: CTU-13,      column: DstAddr,  transform: direct}
      - {dataset: CIC-IDS2018, column: null,     transform: unavailable}
      - {dataset: CICIoT2023,  column: null,     transform: unavailable}
      - {dataset: UNSW-NB15,   column: dstip,    transform: "direct (once re-downloaded)"}

  - unified_field: src_port
    type: int
    sources:
      - {dataset: CTU-13,      column: Sport,    transform: direct}
      - {dataset: CIC-IDS2018, column: null,     transform: unavailable}
      - {dataset: CICIoT2023,  column: null,     transform: unavailable}
      - {dataset: UNSW-NB15,   column: sport,    transform: "direct (once re-downloaded)"}

  - unified_field: dst_port
    type: int
    sources:
      - {dataset: CIC-IDS2018, column: "Dst Port", transform: direct}
      - {dataset: CTU-13,      column: Dport,      transform: direct}
      - {dataset: CICIoT2023,  column: null,       transform: unavailable, note: "only protocol-presence flags"}
      - {dataset: UNSW-NB15,   column: dsport,     transform: "direct (once re-downloaded)"}

  # ---------------- Time ----------------
  - unified_field: timestamp
    type: datetime
    role: temporal_window_key
    sources:
      - {dataset: CIC-IDS2018, column: Timestamp, transform: "parse 'dd/MM/yyyy HH:mm:ss'"}
      - {dataset: CTU-13,      column: StartTime, transform: "parse flow start time"}
      - {dataset: CICIoT2023,  column: null,      transform: unavailable, note: "NO timestamp -> cannot form temporal windows/graphs"}
      - {dataset: UNSW-NB15,   column: Stime,     transform: "epoch->datetime (once re-downloaded)"}

  # ---------------- Protocol ----------------
  - unified_field: protocol
    type: categorical
    sources:
      - {dataset: CIC-IDS2018, column: Protocol,        transform: "numeric proto id"}
      - {dataset: CTU-13,      column: Proto,           transform: "string proto"}
      - {dataset: CICIoT2023,  column: "Protocol Type", transform: "numeric proto id + one-hot flags TCP/UDP/ICMP/ARP/... present as separate cols"}
      - {dataset: UNSW-NB15,   column: proto,           transform: "string proto (once re-downloaded)"}

  # ---------------- Flow duration / volume ----------------
  - unified_field: flow_duration
    type: float
    sources:
      - {dataset: CIC-IDS2018, column: "Flow Duration", transform: "microseconds -> seconds"}
      - {dataset: CTU-13,      column: Dur,             transform: direct}
      - {dataset: CICIoT2023,  column: flow_duration,   transform: direct}
      - {dataset: UNSW-NB15,   column: dur,             transform: "direct (once re-downloaded)"}

  - unified_field: total_fwd_packets
    type: int
    sources:
      - {dataset: CIC-IDS2018, column: "Tot Fwd Pkts", transform: direct}
      - {dataset: CTU-13,      column: TotPkts,        transform: "total (not fwd-split); record as approximation"}
      - {dataset: CICIoT2023,  column: Number,         transform: "packet count proxy; verify semantics"}
      - {dataset: UNSW-NB15,   column: Spkts,          transform: "direct (once re-downloaded)"}

  - unified_field: total_bwd_packets
    type: int
    sources:
      - {dataset: CIC-IDS2018, column: "Tot Bwd Pkts", transform: direct}
      - {dataset: CTU-13,      column: null,           transform: "derive from TotPkts - SrcPkts if available"}
      - {dataset: CICIoT2023,  column: null,           transform: unavailable}
      - {dataset: UNSW-NB15,   column: Dpkts,          transform: "direct (once re-downloaded)"}

  - unified_field: total_fwd_bytes
    type: int
    sources:
      - {dataset: CIC-IDS2018, column: "TotLen Fwd Pkts", transform: direct}
      - {dataset: CTU-13,      column: SrcBytes,          transform: direct}
      - {dataset: CICIoT2023,  column: "Tot sum",         transform: "aggregate byte proxy; verify"}
      - {dataset: UNSW-NB15,   column: sbytes,            transform: "direct (once re-downloaded)"}

  - unified_field: total_bwd_bytes
    type: int
    sources:
      - {dataset: CIC-IDS2018, column: "TotLen Bwd Pkts", transform: direct}
      - {dataset: CTU-13,      column: "TotBytes - SrcBytes", transform: derive}
      - {dataset: CICIoT2023,  column: null,              transform: unavailable}
      - {dataset: UNSW-NB15,   column: dbytes,            transform: "direct (once re-downloaded)"}

  # ---------------- Rates ----------------
  - unified_field: flow_bytes_per_s
    type: float
    sources:
      - {dataset: CIC-IDS2018, column: "Flow Byts/s", transform: "clean Inf/NaN before use"}
      - {dataset: CICIoT2023,  column: Rate,          transform: "rate proxy; verify units"}
      - {dataset: CTU-13,      column: null,          transform: "derive TotBytes/Dur"}
      - {dataset: UNSW-NB15,   column: null,          transform: "derive (once re-downloaded)"}

  - unified_field: flow_pkts_per_s
    type: float
    sources:
      - {dataset: CIC-IDS2018, column: "Flow Pkts/s", transform: "clean Inf/NaN before use"}
      - {dataset: CICIoT2023,  column: Srate,         transform: "src packet rate proxy; verify"}
      - {dataset: CTU-13,      column: null,          transform: "derive TotPkts/Dur"}

  # ---------------- Inter-arrival time (IAT) ----------------
  - unified_field: flow_iat_mean
    type: float
    sources:
      - {dataset: CIC-IDS2018, column: "Flow IAT Mean", transform: direct}
      - {dataset: CICIoT2023,  column: IAT,             transform: "single aggregate IAT -> map to mean"}
      - {dataset: CTU-13,      column: null,            transform: "derive from per-pair StartTime deltas"}
      - {dataset: UNSW-NB15,   column: null,            transform: "derive (once re-downloaded)"}

  - unified_field: fwd_iat_mean
    type: float
    sources:
      - {dataset: CIC-IDS2018, column: "Fwd IAT Mean", transform: direct}
      - {dataset: CICIoT2023,  column: null,           transform: unavailable}
      - {dataset: CTU-13,      column: null,           transform: unavailable}

  # ---------------- TCP flags ----------------
  - unified_field: syn_flag_count
    type: int
    sources:
      - {dataset: CIC-IDS2018, column: "SYN Flag Cnt",   transform: direct}
      - {dataset: CICIoT2023,  column: syn_count,        transform: direct}
      - {dataset: CTU-13,      column: State,            transform: "parse connection state string for SYN"}
      - {dataset: UNSW-NB15,   column: null,             transform: "from state/flags (once re-downloaded)"}

  - unified_field: ack_flag_count
    type: int
    sources:
      - {dataset: CIC-IDS2018, column: "ACK Flag Cnt", transform: direct}
      - {dataset: CICIoT2023,  column: ack_count,      transform: direct}
      - {dataset: CTU-13,      column: State,          transform: parse}

  - unified_field: fin_rst_flag_counts
    type: "int (group)"
    sources:
      - {dataset: CIC-IDS2018, column: ["FIN Flag Cnt","RST Flag Cnt"], transform: direct}
      - {dataset: CICIoT2023,  column: ["fin_count","rst_count","fin_flag_number","rst_flag_number"], transform: direct}
      - {dataset: CTU-13,      column: State, transform: parse}

  # ---------------- Header / window / TTL (mostly unavailable) ----------------
  - unified_field: init_win_bytes_fwd
    type: int
    sources:
      - {dataset: CIC-IDS2018, column: "Init Fwd Win Byts", transform: direct}
      - {dataset: CICIoT2023,  column: null, transform: unavailable}
      - {dataset: CTU-13,      column: null, transform: unavailable}
      - {dataset: UNSW-NB15,   column: swin, transform: "direct (once re-downloaded)"}

  - unified_field: ttl_src
    type: int
    availability: "ONLY UNSW-NB15 (sttl/dttl) provides TTL; CIC family and CTU-13 do not. UNSW-NB15 now PRESENT+VERIFIED on disk."
    sources:
      - {dataset: UNSW-NB15,   column: sttl, transform: "direct (D:\\DATA\\UNSW-NB15\\; also dttl for dest TTL)"}
      - {dataset: CIC-IDS2018, column: null, transform: unavailable}
      - {dataset: CICIoT2023,  column: null, transform: unavailable}
      - {dataset: CTU-13,      column: null, transform: unavailable}
    notes: "Do NOT fabricate TTL for datasets that lack it. UNSW-NB15 raw CSVs are header-less: attach names from NUSW-NB15_features.csv before mapping."

  - unified_field: header_length
    type: int
    sources:
      - {dataset: CICIoT2023,  column: Header_Length, transform: direct}
      - {dataset: CIC-IDS2018, column: ["Fwd Header Len","Bwd Header Len"], transform: "sum/keep separate"}
      - {dataset: CTU-13,      column: null, transform: unavailable}

  # ---------------- Packet-level (NONE of the present datasets ship raw packets) ----------------
  - unified_field: packet_payload_features
    type: "n/a"
    availability: "UNAVAILABLE in all locally-present datasets (flow-level only). CTU-13 MAY include PCAPs on extraction; verify. Never fabricate packet-level features."
    sources:
      - {dataset: CIC-IDS2018, column: null, transform: unavailable}
      - {dataset: CICIoT2023,  column: null, transform: unavailable}
      - {dataset: CTU-13,      column: null, transform: "verify PCAP presence on extraction"}
      - {dataset: UNSW-NB15,   column: null, transform: "PCAP exists upstream (once re-downloaded)"}

  # ---------------- Label ----------------
  - unified_field: label_multiclass
    type: categorical
    sources:
      - {dataset: CIC-IDS2018, column: Label, transform: "keep native family names"}
      - {dataset: CICIoT2023,  column: label, transform: "keep native 34-class taxonomy"}
      - {dataset: CTU-13,      column: Label, transform: "parse Background/Normal/Botnet + family"}
      - {dataset: UNSW-NB15,   column: attack_cat, transform: "direct (once re-downloaded)"}
    notes: >
      Do NOT unify label taxonomies into one namespace yet — families differ per
      dataset and premature merging destroys OOD/novelty experiments. Keep a
      per-dataset label space plus an optional coarse {benign, attack} view.

  - unified_field: label_binary
    type: "categorical {benign, attack}"
    sources:
      - {dataset: CIC-IDS2018, column: Label, transform: "Benign -> benign; else attack"}
      - {dataset: CICIoT2023,  column: label, transform: "BenignTraffic -> benign; else attack"}
      - {dataset: CTU-13,      column: Label, transform: "Normal/Background -> benign(caution); Botnet -> attack"}
      - {dataset: UNSW-NB15,   column: Label, transform: "0/1 (once re-downloaded)"}

mapping_notes:
  - "CIC-IDS2018 and CICIoT2023 share NO entity identifiers and CICIoT2023 has no timestamp -> neither can build G_t alone."
  - "CTU-13 AND UNSW-NB15 both have full (src/dst IP + ports + timestamps) -> both are graph/temporal-capable. CTU-13 = real botnet propagation over time; UNSW-NB15 = testbed with a provided IID split."
  - "Feature overlap between CIC-IDS2018 and CICIoT2023 is CONCEPTUAL (both flow stats + flags + IAT) but schemas are DIFFERENT (80 vs 47 cols); mapping is approximate and must be validated, never assumed 1:1."
  - "UNSW-NB15 (now PRESENT+VERIFIED at D:\\DATA\\UNSW-NB15\\) is the ONLY local source with TTL (sttl/dttl), TCP window (swin/dwin), and retransmission (sloss/dloss)."
  - "UNSW-NB15 raw files UNSW-NB15_1..4.csv are HEADER-LESS 49-column CSVs -> attach names from NUSW-NB15_features.csv before any mapping, or columns silently misalign. The train/test partition CSVs DO have headers (and add id + service, carry attack_cat,Label)."
